<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinanFit - 회원가입</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Pretendard, Arial, sans-serif;
            background: #f5f8f7;
            color: #222;
        }

        header {
            height: 82px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 7%;
            border-bottom: 1px solid #e7eceb;
        }

        header img {
            width: 160px;
            object-fit: contain;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 55px auto;
            padding: 0 20px 80px;
        }

        .title {
            margin-bottom: 32px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #777;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 38px;
            border: 1px solid #e6ecea;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d9e0de;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #008878;
            box-shadow: 0 0 0 3px rgba(0,136,120,0.08);
        }

        input[type=file] {
            padding: 11px;
        }

        .button-area {
            display: flex;
            gap: 12px;
            margin-top: 35px;
        }

        .btn {
            height: 52px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        .cancel {
            background: white;
            border: 1px solid #d6dddb;
            color: #555;
        }

        .submit {
            border: none;
            background: #008878;
            color: white;
        }

        .submit:hover {
            background: #006f63;
        }

        .error {
            background: #fff0f0;
            color: #d63737;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        @media(max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

    </style>
</head>

<body>

<header>
    <a href="/login">
        <img src="/static/logo.png">
    </a>
</header>

<div class="container">

    <div class="title">
        <h1>회원가입</h1>
        <p>
            금융상품 추천을 위한 기본 정보를 입력해주세요.
        </p>
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form
        class="card"
        action="/signup"
        method="post"
        enctype="multipart/form-data"
    >

        <div class="grid">

            <div>
                <label>아이디</label>

                <input
                    type="text"
                    name="username"
                    placeholder="아이디"
                    required
                >
            </div>

            <div>
                <label>비밀번호</label>

                <input
                    type="password"
                    name="password"
                    placeholder="비밀번호"
                    required
                >
            </div>

            <div>
                <label>이름</label>

                <input
                    type="text"
                    name="name"
                    placeholder="이름"
                    required
                >
            </div>

            <div>
                <label>이메일</label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div>
                <label>나이</label>

                <input
                    type="number"
                    name="age"
                    min="1"
                    max="120"
                    required
                >
            </div>

            <div>
                <label>성별</label>

                <select name="gender" required>

                    <option value="">선택</option>

                    <option value="남성">
                        남성
                    </option>

                    <option value="여성">
                        여성
                    </option>

                    <option value="기타">
                        기타
                    </option>

                </select>
            </div>

            <div>
                <label>투자성향</label>

                <select name="investment_type" required>

                    <option value="">선택</option>

                    <option value="안정형">
                        안정형
                    </option>

                    <option value="안정추구형">
                        안정추구형
                    </option>

                    <option value="위험중립형">
                        위험중립형
                    </option>

                    <option value="적극투자형">
                        적극투자형
                    </option>

                    <option value="공격투자형">
                        공격투자형
                    </option>

                </select>
            </div>

            <div>
                <label>직업</label>

                <select name="job" required>

                    <option value="">선택</option>

                    <option value="직장인">
                        직장인
                    </option>

                    <option value="공무원">
                        공무원
                    </option>

                    <option value="자영업자">
                        자영업자
                    </option>

                    <option value="사업자">
                        사업자
                    </option>

                    <option value="학생">
                        학생
                    </option>

                    <option value="프리랜서">
                        프리랜서
                    </option>

                    <option value="무직">
                        무직
                    </option>

                    <option value="기타">
                        기타
                    </option>

                </select>
            </div>

            <div class="full">

                <label>
                    연소득
                </label>

                <input
                    type="number"
                    name="income"
                    min="0"
                    placeholder="예: 40000000"
                    required
                >

            </div>

            <div class="full">

                <label>
                    프로필 사진
                </label>

                <input
                    type="file"
                    name="profile_image"
                    accept="image/*"
                >

            </div>

        </div>

        <div class="button-area">

            <button
                type="button"
                class="btn cancel"
                onclick="location.href='/login'"
            >
                취소
            </button>

            <button
                type="submit"
                class="btn submit"
            >
                가입하기
            </button>

        </div>

    </form>

</div>

</body>
</html>
