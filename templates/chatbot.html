<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinanFit AI 상담</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Pretendard, Arial, sans-serif;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
            color: #222;
        }

        .layout {
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: #006f63;
            color: white;
            padding: 26px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .sidebar-logo img {
            width: 140px;
            display: block;
        }

        .new-chat {
            height: 48px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 11px;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .menu-title {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 28px;
            margin-bottom: 12px;
        }

        .menu-item {
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.09);
        }

        .side-bottom {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.18);
            padding-top: 20px;
        }

        .side-bottom a {
            display: block;
            color: white;
            text-decoration: none;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .topbar {
            height: 72px;
            border-bottom: 1px solid #ebefee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 800;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #1eba86;
            border-radius: 50%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 35px 0 145px;
        }

        .message-row {
            width: 100%;
            padding: 21px 8%;
        }

        .assistant-row {
            background: #f7faf9;
        }

        .message-inner {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            gap: 18px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .assistant-avatar {
            background: #008878;
        }

        .assistant-avatar img {
            width: 36px;
            height: 36px;
            object-fit: cover;
        }

        .user-avatar {
            background: #dfe6e4;
            color: #555;
            font-weight: 800;
        }

        .message-content {
            line-height: 1.75;
            font-size: 15px;
            white-space: pre-wrap;
            padding-top: 7px;
        }

        .input-area {
            position: fixed;
            left: 260px;
            bottom: 0;
            right: 0;
            padding: 18px 30px 24px;
            background:
                linear-gradient(
                    to top,
                    white 75%,
                    rgba(255,255,255,0)
                );
        }

        .input-wrapper {
            max-width: 850px;
            margin: auto;
            position: relative;
        }

        .input-box {
            width: 100%;
            min-height: 58px;
            max-height: 160px;
            border: 1px solid #d9dfdd;
            border-radius: 16px;
            padding: 17px 62px 17px 18px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }

        .input-box:focus {
            border-color: #008878;
        }

        .send-button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            background: #008878;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .notice {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .suggestion {
            border: 1px solid #e0e7e5;
            background: white;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .suggestion:hover {
            border-color: #008878;
            background: #f6fbfa;
        }

        .loading {
            display: inline-flex;
            gap: 5px;
        }

        .loading span {
            width: 7px;
            height: 7px;
            background: #909997;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @media(max-width: 800px) {

            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

        }

    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="/static/logo.png">
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ 새 상담
        </button>

        <div class="menu-title">
            상담 메뉴
        </div>

        <div
            class="menu-item"
            onclick="sendPreset('내 조건에 가장 잘 맞는 예금상품을 추천해줘.')"
        >
            맞춤 상품 추천
        </div>

        <div
            class="menu-item"
            onclick="sendPreset('추천 상품들의 금리를 비교해줘.')"
        >
            금리 비교
        </div>

        <div
            class="menu-item"
            onclick="sendPreset('가입기간이 짧은 상품을 알려줘.')"
        >
            단기 상품 찾기
        </div>

        <div
            class="menu-item"
            onclick="sendPreset('모바일로 가입 가능한 상품을 알려줘.')"
        >
            비대면 상품 찾기
        </div>

        <div class="side-bottom">

            <a href="/main">
                ← 추천상품으로 돌아가기
            </a>

            <a href="/logout">
                로그아웃
            </a>

        </div>

    </aside>


    <main class="chat-area">

        <header class="topbar">

            <div class="topbar-title">
                FinanFit AI 금융상담
            </div>

            <div class="online">
                <span class="dot"></span>
                상담 가능
            </div>

        </header>


        <section
            id="messages"
            class="messages"
        >

            <div class="message-row assistant-row">

                <div class="message-inner">

                    <div class="avatar assistant-avatar">

                        <img
                            src="/static/chatbot.png"
                            alt="챗봇"
                        >

                    </div>

                    <div>

                        <div class="message-content">
안녕하세요, {{ user["name"] }}님.
FinanFit 금융상품 상담 AI입니다.

회원님의 나이, 투자성향, 직업, 소득 정보를 기반으로 예금상품을 안내해드릴 수 있습니다.

궁금한 내용을 자유롭게 질문해주세요.
                        </div>

                        <div class="suggestions">

                            <div
                                class="suggestion"
                                onclick="sendPreset('나에게 가장 적합한 예금상품 3개를 알려줘.')"
                            >
                                추천상품 3개 알려줘
                            </div>

                            <div
                                class="suggestion"
                                onclick="sendPreset('금리가 가장 높은 상품은 뭐야?')"
                            >
                                최고 금리 상품 찾기
                            </div>

                            <div
                                class="suggestion"
                                onclick="sendPreset('가입기간이 1년 정도인 상품을 추천해줘.')"
                            >
                                1년 예금 찾기
                            </div>

                            <div
                                class="suggestion"
                                onclick="sendPreset('추천 상품을 쉽게 비교해서 설명해줘.')"
                            >
                                추천상품 비교
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    class="input-box"
                    placeholder="금융상품에 대해 질문해보세요."
                    rows="1"
                ></textarea>

                <button
                    class="send-button"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

            <div class="notice">
                실제 가입 전 금융사의 상품 조건과 최신 금리를 확인해주세요.
            </div>

        </div>

    </main>

</div>


<script>

const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");


input.addEventListener("keydown", function(e) {

    if (
        e.key === "Enter" &&
        !e.shiftKey
    ) {

        e.preventDefault();

        sendMessage();

    }

});


input.addEventListener("input", function() {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 160) + "px";

});


function addUserMessage(text) {

    const row = document.createElement("div");

    row.className = "message-row";

    row.innerHTML = `
        <div class="message-inner">

            <div class="avatar user-avatar">
                나
            </div>

            <div class="message-content"></div>

        </div>
    `;

    row.querySelector(".message-content").textContent = text;

    messages.appendChild(row);

    scrollBottom();

}


function addAssistantMessage(text) {

    const row = document.createElement("div");

    row.className = "message-row assistant-row";

    row.innerHTML = `
        <div class="message-inner">

            <div class="avatar assistant-avatar">
                <img
                    src="/static/chatbot.png"
                    alt="챗봇"
                >
            </div>

            <div class="message-content"></div>

        </div>
    `;

    row.querySelector(".message-content").textContent = text;

    messages.appendChild(row);

    scrollBottom();

}


function addLoading() {

    const row = document.createElement("div");

    row.id = "loadingMessage";

    row.className = "message-row assistant-row";

    row.innerHTML = `
        <div class="message-inner">

            <div class="avatar assistant-avatar">

                <img
                    src="/static/chatbot.png"
                >

            </div>

            <div class="message-content">

                <div class="loading">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>
    `;

    messages.appendChild(row);

    scrollBottom();

}


function removeLoading() {

    const loading =
        document.getElementById("loadingMessage");

    if (loading) {

        loading.remove();

    }

}


async function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }

    addUserMessage(text);

    input.value = "";

    input.style.height = "auto";

    addLoading();

    try {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        removeLoading();

        addAssistantMessage(
            data.answer || "답변을 가져오지 못했습니다."
        );

    } catch (error) {

        removeLoading();

        addAssistantMessage(
            "서버와 통신 중 오류가 발생했습니다."
        );

    }

}


function sendPreset(text) {

    input.value = text;

    sendMessage();

}


function newChat() {

    messages.innerHTML = `
        <div class="message-row assistant-row">

            <div class="message-inner">

                <div class="avatar assistant-avatar">

                    <img
                        src="/static/chatbot.png"
                    >

                </div>

                <div class="message-content">
새로운 금융상품 상담을 시작합니다.
궁금한 내용을 입력해주세요.
                </div>

            </div>

        </div>
    `;

}


function scrollBottom() {

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
